<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotoNAV · Diagnostica limiti</title><style>body{font:16px system-ui;background:#0c1422;color:#eaf4ff;margin:0;padding:20px;max-width:740px}button{background:#23b9d5;border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#162539;padding:14px;border-radius:12px;line-height:1.5}small{color:#b6c9d9}</style></head><body><h2>🏍️ MotoNAV · Diagnostica limiti OSM</h2><p>Test indipendente dalla navigazione. Non modifica percorsi, GPS o impostazioni.</p><button id="go">Avvia test</button><p><small>Campione: Milano centro, raggio 200 m. Ogni servizio viene testato separatamente (max 7 secondi).</small></p><pre id="out">Pronto.</pre><script>const out=document.getElementById('out'),btn=document.getElementById('go');function log(t){out.textContent+='\n'+t}const q='[out:json][timeout:6];way(around:200,45.4642,9.1900)[highway][maxspeed];out tags;';const servers=['https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass-api.de/api/interpreter','https://overpass.nchc.org.tw/api/interpreter'];btn.onclick=async()=>{btn.disabled=true;out.textContent='Avvio test '+new Date().toLocaleString('it-IT');for(const url of servers){log('\n'+url);const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),7000),start=performance.now();try{const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q),signal:controller.signal,cache:'no-store'});const raw=await response.text();const elapsed=Math.round(performance.now()-start);if(!response.ok){log('HTTP '+response.status+' · '+elapsed+' ms · '+raw.slice(0,100));continue}let data;try{data=JSON.parse(raw)}catch(e){log('Risposta non JSON · '+elapsed+' ms · '+raw.slice(0,100));continue}const ways=(data.elements||[]).filter(e=>e.type==='way');log('OK · '+elapsed+' ms · '+ways.length+' strade con maxspeed');log('Esempi: '+ways.slice(0,4).map(w=>w.tags?.maxspeed||'?').join(', '))}catch(e){log((e.name==='AbortError'?'TIMEOUT':'ERRORE '+e.name+': '+e.message)+' · '+Math.round(performance.now()-start)+' ms')}finally{clearTimeout(timer)}}log('\nTest completato. Copia qui i risultati.');btn.disabled=false};</script></body></html>
