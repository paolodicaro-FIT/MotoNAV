<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotoNAV · Test Valhalla limiti</title><style>body{font:16px system-ui;background:#0c1422;color:#eaf4ff;margin:0;padding:20px;max-width:760px}button{background:#23b9d5;border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#162539;padding:14px;border-radius:12px;line-height:1.5}small{color:#b6c9d9}</style></head><body><h2>🏍️ MotoNAV · Test Valhalla</h2><p>Verifica alternativa a Overpass per leggere i limiti stradali <code>speed_limit</code> associati alle strade. Test indipendente: nessuna modifica alla navigazione.</p><button id="go">Avvia test Valhalla</button><p><small>Campione: breve percorso stradale a Milano. Due endpoint, timeout 12 secondi ciascuno.</small></p><pre id="out">Pronto.</pre><script>const out=document.getElementById('out'),btn=document.getElementById('go');function log(t){out.textContent+='\n'+t}const shape=[{lat:45.46523,lon:9.18672},{lat:45.46527,lon:9.18809},{lat:45.46535,lon:9.18955},{lat:45.46544,lon:9.19105},{lat:45.46558,lon:9.19244}];const payload={shape,costing:'auto',shape_match:'map_snap',units:'kilometers'};const endpoints=['https://valhalla1.openstreetmap.de/trace_attributes','https://valhalla2.openstreetmap.de/trace_attributes'];btn.onclick=async()=>{btn.disabled=true;out.textContent='Avvio test '+new Date().toLocaleString('it-IT');for(const url of endpoints){log('\n'+url);const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000),start=performance.now();try{const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal,cache:'no-store'});const raw=await response.text();const elapsed=Math.round(performance.now()-start);if(!response.ok){log('HTTP '+response.status+' · '+elapsed+' ms · '+raw.slice(0,220));continue}let data;try{data=JSON.parse(raw)}catch(e){log('Risposta non JSON · '+elapsed+' ms · '+raw.slice(0,100));continue}const edges=Array.isArray(data.edges)?data.edges:[];const withLimit=edges.filter(e=>Number.isFinite(Number(e.speed_limit))&&Number(e.speed_limit)>0);log('OK · '+elapsed+' ms · '+edges.length+' segmenti · '+withLimit.length+' con speed_limit numerico');log('Esempi: '+edges.slice(0,8).map(e=>(e.names||[]).join('/')+': limite='+String(e.speed_limit??'assente')+', speed='+String(e.speed??'assente')).join(' | '));if(!edges.length)log('Nota: risposta senza segmenti; matching non riuscito oppure servizio non supportato')}catch(e){log((e.name==='AbortError'?'TIMEOUT':'ERRORE '+e.name+': '+e.message)+' · '+Math.round(performance.now()-start)+' ms')}finally{clearTimeout(timer)}}log('\nTest completato. Copia qui i risultati.');btn.disabled=false};</script></body></html>
