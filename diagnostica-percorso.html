<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotoNAV · Test limiti percorso</title><style>body{font:16px system-ui;background:#0c1422;color:#eaf4ff;margin:0;padding:20px;max-width:760px}button{background:#23b9d5;border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#162539;padding:14px;border-radius:12px;line-height:1.5}small{color:#b6c9d9}</style></head><body><h2>🏍️ MotoNAV · Limiti su itinerario</h2><p>Test indipendente: verifica più segmenti lungo un itinerario, senza cambiare Moto-NAV.</p><button id="go">Avvia test percorso</button><p><small>Itinerario campione Milano: Duomo → Porta Venezia → Stazione Centrale. Un server Valhalla, massimo 12 secondi per richiesta.</small></p><pre id="out">Pronto.</pre><script>const out=document.getElementById('out'),btn=document.getElementById('go'),base='https://valhalla1.openstreetmap.de';function log(t){out.textContent+='\n'+t}async function call(path,payload){const c=new AbortController(),timer=setTimeout(()=>c.abort(),12000),start=performance.now();try{const r=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:c.signal,cache:'no-store'});const raw=await r.text();if(!r.ok)throw Error('HTTP '+r.status+' '+raw.slice(0,140));return {data:JSON.parse(raw),ms:Math.round(performance.now()-start)}}finally{clearTimeout(timer)}}btn.onclick=async()=>{btn.disabled=true;out.textContent='Avvio '+new Date().toLocaleString('it-IT');const locations=[{lat:45.4642,lon:9.1900},{lat:45.4744,lon:9.2058},{lat:45.4859,lon:9.2044}];try{log('1. Calcolo itinerario Valhalla…');const route=await call('/route',{locations,costing:'auto',directions_options:{units:'kilometers'}});log('Percorso OK · '+route.ms+' ms · '+(route.data.trip?.summary?.length??'?')+' km');const legs=route.data.trip?.legs||[];let coords=[];function decode(encoded){let index=0,lat=0,lon=0,result=[];while(index<encoded.length){let shift=0,val=0,b;do{b=encoded.charCodeAt(index++)-63;val|=(b&31)<<shift;shift+=5}while(b>=32);lat+=(val&1)?~(val>>1):(val>>1);shift=0;val=0;do{b=encoded.charCodeAt(index++)-63;val|=(b&31)<<shift;shift+=5}while(b>=32);lon+=(val&1)?~(val>>1):(val>>1);result.push({lat:lat/1e6,lon:lon/1e6})}return result}for(const leg of legs){if(leg.shape){const c=decode(leg.shape);coords.push(...(coords.length?c.slice(1):c))}}log('Geometria: '+coords.length+' punti');if(coords.length<2)throw Error('Geometria non disponibile');const step=Math.max(1,Math.ceil(coords.length/120));const sampled=coords.filter((_,i)=>i%step===0);if(sampled.at(-1)!==coords.at(-1))sampled.push(coords.at(-1));log('2. Matching di '+sampled.length+' punti e lettura speed_limit…');const attr=await call('/trace_attributes',{shape:sampled,costing:'auto',shape_match:'map_snap',filters:{action:'include',attributes:['edge.names','edge.speed_limit','edge.speed','edge.length','matched.point','shape']}});const edges=attr.data.edges||[];const numeric=edges.filter(e=>Number.isFinite(Number(e.speed_limit))&&Number(e.speed_limit)>0);log('Risposta OK · '+attr.ms+' ms');log('Segmenti: '+edges.length+' · con limite: '+numeric.length+' · senza limite: '+(edges.length-numeric.length));const counts={};for(const e of numeric){counts[e.speed_limit]=(counts[e.speed_limit]||0)+1}log('Limiti distinti: '+(Object.entries(counts).map(([k,v])=>k+' km/h ('+v+' segmenti)').join(', ')||'nessuno'));log('Prime strade:');for(const e of edges.slice(0,18))log(' • '+(e.names?.join(', ')||'(senza nome)')+' · limite '+(e.speed_limit??'—')+' · velocità stimata '+(e.speed??'—'));log('Nota: speed non è il limite; solo speed_limit è usato come limite.')}catch(e){log('ERRORE: '+(e.name==='AbortError'?'timeout 12 secondi':e.message))}log('\nTest completato. Copia qui il risultato.');btn.disabled=false};</script></body></html>
