name: Prepara mappa offline Lombardia
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Installa Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
      - name: Scarica dati OSM Nord-Ovest da Geofabrik
        run: |
          mkdir -p data
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 30 --output data/nord-ovest.osm.pbf \
            https://download.geofabrik.de/europe/italy/nord-ovest-latest.osm.pbf
          osmium fileinfo data/nord-ovest.osm.pbf
      - name: Ritaglia Lombardia e area limitrofa
        run: |
          osmium extract --bbox 8.45,44.65,11.55,46.75 \
            --strategy complete_ways \
            --output data/lombardia.osm.pbf data/nord-ovest.osm.pbf
          osmium fileinfo data/lombardia.osm.pbf
          rm data/nord-ovest.osm.pbf
      - name: Genera PMTiles con Planetiler
        run: |
          mkdir -p dist
          docker run --rm \
            -e JAVA_TOOL_OPTIONS="-Xmx5g" \
            -v "$PWD/data:/data/input:ro" \
            -v "$PWD/dist:/data/output" \
            ghcr.io/onthegomap/planetiler:latest \
            --osm-path=/data/input/lombardia.osm.pbf \
            --output=/data/output/lombardia.pmtiles \
            --download \
            --force
          test -s dist/lombardia.pmtiles
          ls -lh dist/lombardia.pmtiles
      - uses: actions/upload-artifact@v4
        with:
          name: lombardia-pmtiles
          path: dist/lombardia.pmtiles
          retention-days: 7
          if-no-files-found: error
