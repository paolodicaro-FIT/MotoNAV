name: Prepara mappa offline Lombardia
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Archivio Protomaps ufficiale (PMTiles)"
        required: true
        default: "https://build.protomaps.com/20261012.pmtiles"
      max_zoom:
        description: "Livello massimo di dettaglio (12 prova, 14 strade)"
        required: true
        default: "12"
        type: choice
        options: ["12", "13", "14"]
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configura Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Installa pmtiles CLI
        run: |
          go install github.com/protomaps/go-pmtiles@v1.31.2
          sudo install -m 755 "$(go env GOPATH)/bin/go-pmtiles" /usr/local/bin/pmtiles
          pmtiles --help
      - name: Controlla disponibilità archivio
        run: |
          echo "Controllo sorgente: ${{ inputs.source_url }}"
          curl -fLsS -r 0-6 --max-time 30 -o /tmp/pmtiles-header "${{ inputs.source_url }}"
          test "$(head -c 7 /tmp/pmtiles-header)" = "PMTiles"
      - name: Estrai Lombardia
        run: |
          mkdir -p dist
          pmtiles extract "${{ inputs.source_url }}" dist/lombardia.pmtiles --bbox=8.45,44.65,11.55,46.75 --maxzoom="${{ inputs.max_zoom }}"
          pmtiles verify dist/lombardia.pmtiles
          ls -lh dist/lombardia.pmtiles
      - uses: actions/upload-artifact@v4
        with:
          name: lombardia-pmtiles-z${{ inputs.max_zoom }}
          path: dist/lombardia.pmtiles
          retention-days: 7
